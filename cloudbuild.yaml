# Google Cloud Build configuration for Love Actually Backend
# This builds and deploys the backend to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lovetrae-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lovetrae-backend:latest'
      - './backend'
    id: 'build-backend'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lovetrae-backend:$COMMIT_SHA'
    id: 'push-backend'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lovetrae-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lovetrae-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--set-secrets'
      - 'FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest'
    id: 'deploy-backend'

  # Step 4: Run health check
  - name: 'gcr.io/cloud-builders/curl'
    args:
      - '-f'
      - 'https://lovetrae-backend-${_REGION}-a.run.app/api/health'
    id: 'health-check'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lovetrae-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lovetrae-backend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Substitutions (set in Cloud Build triggers or gcloud builds submit)
substitutions:
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_PRIVATE_KEY_ID: ''
  _REGION: us-central1

# Timeout for the entire build
timeout: 1800s